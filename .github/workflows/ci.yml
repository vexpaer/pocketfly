name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:

jobs:
  native-tests:
    name: Native C++ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run native test suite
        run: ./scripts/run-native-tests.sh

  android:
    name: Android build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Kotlin & JVM unit tests
        run: ./gradlew :core:test :simulator:testDebugUnitTest :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketfly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
