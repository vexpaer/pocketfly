name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:

jobs:
  native-tests:
    name: Native C++ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run native test suite
        run: ./scripts/run-native-tests.sh

  android:
    name: Simulator build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (sample checksum coverage)
        env:
          POCKETFLY_SAMPLE_ZIP: data/sample/sample_1024.pflybrain
        run: ./gradlew :simulator:testDebugUnitTest

      - name: Assemble simulator (native build via NDK)
        run: ./gradlew :simulator:assembleDebug
