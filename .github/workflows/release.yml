name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (if secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETFLY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "POCKETFLY_KEYSTORE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "POCKETFLY_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "POCKETFLY_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          POCKETFLY_KEYSTORE_PASSWORD: ${{ secrets.POCKETFLY_KEYSTORE_PASSWORD }}
          POCKETFLY_KEY_ALIAS: ${{ secrets.POCKETFLY_KEY_ALIAS }}
          POCKETFLY_KEY_PASSWORD: ${{ secrets.POCKETFLY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
